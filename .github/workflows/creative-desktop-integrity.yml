name: Creative desktop record integrity
on:
  pull_request:
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'Flask==3.1.2'
      - run: python -m unittest discover -s desktop_suite/tests -p 'test_creative_*.py' -v
      - run: |
          python -c "from pathlib import Path; s=Path('desktop_suite/ui/index.html').read_text(); Path('/tmp/creative-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/creative-ui.js
