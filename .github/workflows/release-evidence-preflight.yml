name: Phoenix Creator Studio Release Evidence Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-audit:
    name: Non-secret full Git-history credential audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run non-secret history credential audit
        shell: bash
        run: |
          set -o pipefail
          npm run audit:history-secrets | tee history-secret-audit.log

      - name: Verify audit output is non-secret and summarize review state
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('history-secret-audit.json', 'utf8'));
          if (report.format !== 'phoenix-creator-studio.git-history-secret-audit') {
            throw new Error('Unexpected history-audit format.');
          }
          if (report.secretValuesIncluded !== false) {
            throw new Error('History audit must never include raw secret values.');
          }
          const summary = {
            format: 'phoenix-creator-studio.git-history-secret-audit-summary',
            version: 1,
            findingCount: report.findingCount,
            uniqueFingerprintCount: report.uniqueFingerprintCount,
            currentTreeFindings: report.currentTreeFindings,
            historicalOnlyFindings: report.historicalOnlyFindings,
            fixtureOrExampleFindings: report.fixtureOrExampleFindings,
            currentTreeReviewFindings: report.currentTreeReviewFindings,
            historicalReviewFindings: report.historicalReviewFindings,
            reviewRequired: report.reviewRequired,
            historyReviewRequired: report.historyReviewRequired,
            secretValuesIncluded: false,
          };
          fs.writeFileSync('history-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload non-secret history audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-creator-studio-history-audit
          path: |
            history-secret-audit.json
            history-audit-summary.json
            history-secret-audit.log
          if-no-files-found: warn
          retention-days: 30
