name: Phoenix Creator Studio Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: Exact isolated staging deployment URL
        required: true
        type: string
      expected_commit_sha:
        description: Exact 40-character commit deployed to staging
        required: true
        type: string
      rollback_commit_sha:
        description: Last verified rollback commit
        required: true
        type: string
      approval_phrase:
        description: Type RUN_ISOLATED_STAGING_ACCEPTANCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phoenix-creator-studio-live-staging
  cancel-in-progress: false

jobs:
  accept:
    name: Live isolated staging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: production
      STAGING_CONFIRM_ISOLATED: "true"
      ALLOW_REMOTE_TESTS: "true"
      STAGING_BASE_URL: ${{ inputs.staging_base_url }}
      NEXTAUTH_URL: ${{ inputs.staging_base_url }}
      DEPLOYMENT_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      ROLLBACK_COMMIT_SHA: ${{ inputs.rollback_commit_sha }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_MIGRATION_URL: ${{ secrets.STAGING_DATABASE_MIGRATION_URL }}
      NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
      STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.STAGING_SUPABASE_STORAGE_BUCKET }}
      RATE_LIMIT_PROVIDER: upstash
      RATE_LIMIT_URL: ${{ secrets.STAGING_RATE_LIMIT_URL }}
      RATE_LIMIT_TOKEN: ${{ secrets.STAGING_RATE_LIMIT_TOKEN }}
      FEATURE_PROJECT_RESTORE: "true"
      ENABLE_TEST_AUTH_BYPASS: "false"
      CREDENTIAL_ROTATION_CONFIRMED: ${{ vars.CREDENTIAL_ROTATION_CONFIRMED }}
      HISTORY_REVIEW_CONFIRMED: ${{ vars.HISTORY_REVIEW_CONFIRMED }}
      ROLLBACK_REHEARSAL_CONFIRMED: ${{ vars.ROLLBACK_REHEARSAL_CONFIRMED }}
      PLAYWRIGHT_VERSION: "1.62.0"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Enforce explicit staging approval
        shell: bash
        run: |
          test "${{ inputs.approval_phrase }}" = "RUN_ISOLATED_STAGING_ACCEPTANCE"
          test "${#DEPLOYMENT_COMMIT_SHA}" = "40"
          test "${#ROLLBACK_COMMIT_SHA}" = "40"
          test -n "$PRODUCTION_BASE_URL"
          test "$STAGING_BASE_URL" != "$PRODUCTION_BASE_URL"

      - name: Check out the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked application dependencies
        id: install
        shell: bash
        run: npm ci

      - name: Install exact Playwright browser runtime
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --ignore-scripts "@playwright/test@${PLAYWRIGHT_VERSION}" \
            2>&1 | tee playwright-install.log
          npx playwright install --with-deps chromium firefox webkit \
            2>&1 | tee playwright-browser-install.log
          npx playwright --version | tee playwright-version.log
          node - <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          if (!chromium || !firefox || !webkit) throw new Error('Playwright browser engines were not installed.');
          NODE

      - name: Validate staging deployment policy
        id: envcheck
        continue-on-error: true
        shell: bash
        run: npm run env:check:staging | tee staging-environment.log

      - name: Verify exact deployment identity
        id: identity
        if: steps.envcheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error "$STAGING_BASE_URL/api/health/deployment" \
            | tee deployment-identity.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('deployment-identity.json', 'utf8'));
          const expected = process.env.DEPLOYMENT_COMMIT_SHA.toLowerCase();
          if (!body.ok || body.data?.environment !== 'staging') throw new Error('Deployment identity is not staging.');
          if (body.data?.commitSha !== expected) throw new Error(`Deployment commit mismatch: ${body.data?.commitSha}`);
          if (body.data?.storageProvider !== 'supabase') throw new Error('Supabase storage is not active.');
          if (body.data?.rateLimitProvider !== 'upstash') throw new Error('Upstash rate limiting is not active.');
          if (!body.data?.projectRestoreEnabled) throw new Error('Project restore feature is not enabled for the drill.');
          if (body.data?.testAuthBypassEnabled) throw new Error('Test auth bypass is active in staging.');
          NODE

      - name: Verify live Supabase and Upstash providers
        id: providers
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-live-staging-providers.mjs | tee live-provider.log

      - name: Run PCS-CHR-1440 browser acceptance
        id: chromium
        if: steps.identity.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          BROWSER_ENGINE: chromium
        shell: bash
        run: |
          set -o pipefail
          node verify-staging-browser.js | tee staging-browser-chromium.log

      - name: Run PCS-FF-1440 browser acceptance
        id: firefox
        if: steps.identity.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          BROWSER_ENGINE: firefox
        shell: bash
        run: |
          set -o pipefail
          node verify-staging-browser.js | tee staging-browser-firefox.log

      - name: Run PCS-WK-1440 browser acceptance
        id: webkit
        if: steps.identity.outcome == 'success' && steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          BROWSER_ENGINE: webkit
        shell: bash
        run: |
          set -o pipefail
          node verify-staging-browser.js | tee staging-browser-webkit.log

      - name: Run authenticated staging vertical slice and recovery drill
        id: acceptance
        if: steps.identity.outcome == 'success' && steps.providers.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node verify-staging-acceptance.js | tee staging-acceptance-evidence.json

      - name: Enforce final staging cleanup
        id: cleanup
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/cleanup-staging-acceptance.mjs | tee staging-cleanup.log

      - name: Record staging run metadata
        if: always()
        shell: bash
        run: |
          cat > staging-run-summary.json <<EOF
          {
            "repository": "Bboy9090/SagaArchitect",
            "commitSha": "${DEPLOYMENT_COMMIT_SHA}",
            "rollbackCommitSha": "${ROLLBACK_COMMIT_SHA}",
            "stagingUrl": "${STAGING_BASE_URL}",
            "browserConfigurations": ["PCS-CHR-1440", "PCS-FF-1440", "PCS-WK-1440"],
            "playwrightVersion": "${PLAYWRIGHT_VERSION}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Generate staging classification receipt
        id: receipt
        if: always()
        continue-on-error: true
        shell: bash
        run: node scripts/generate-staging-receipt.mjs | tee staging-receipt.log

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-creator-studio-staging-acceptance
          path: |
            staging-environment.log
            deployment-identity.json
            live-provider.log
            live-provider-evidence.json
            playwright-install.log
            playwright-browser-install.log
            playwright-version.log
            staging-browser-chromium.log
            staging-browser-firefox.log
            staging-browser-webkit.log
            staging-acceptance-evidence.json
            staging-cleanup.log
            staging-cleanup-evidence.json
            artifacts/staging-browser/
            staging-run-summary.json
            staging-evidence-receipt.json
            staging-receipt.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce staging acceptance gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.playwright.outcome }}" = "success"
          test "${{ steps.envcheck.outcome }}" = "success"
          test "${{ steps.identity.outcome }}" = "success"
          test "${{ steps.providers.outcome }}" = "success"
          test "${{ steps.chromium.outcome }}" = "success"
          test "${{ steps.firefox.outcome }}" = "success"
          test "${{ steps.webkit.outcome }}" = "success"
          test "${{ steps.acceptance.outcome }}" = "success"
          test "${{ steps.cleanup.outcome }}" = "success"
          test "${{ steps.receipt.outcome }}" = "success"
