name: Repair package lockfile

on:
  pull_request:
  push:
    branches:
      - enterprise/foundation-sprint-1

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          retention-days: 1
