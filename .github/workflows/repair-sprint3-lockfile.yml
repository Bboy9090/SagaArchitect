name: Repair Sprint 3 lockfile

on:
  push:
    branches:
      - enterprise/foundation-sprint-3

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise/foundation-sprint-3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Synchronize package lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized package lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize Sprint 3 package lockfile"
          git push origin HEAD:enterprise/foundation-sprint-3
