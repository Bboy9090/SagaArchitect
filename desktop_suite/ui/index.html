<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phoenix Creator Bench</title>
<style>
  :root {
    --bg: #140E0B;
    --surface: #211915;
    --surface2: #302620;
    --primary: #FF640C;
    --accent: #0D88F5;
    --text: #F4F7FC;
    --muted: #9CAEC8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top right, var(--surface2) 0%, var(--bg) 62%);
    color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at center, rgba(10,14,28,0.45), rgba(5,8,18,0.96)),
                url('/assets/splash_1280x720.jpg') center/cover no-repeat;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 56px;
    transition: opacity 0.55s ease, visibility 0.55s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-card {
    background: rgba(8,12,24,0.86); backdrop-filter: blur(18px);
    border: 1px solid var(--primary); border-radius: 22px; padding: 22px 36px;
    display: flex; align-items: center; gap: 22px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  }
  .splash-card img { width: 78px; height: 78px; border-radius: 18px; border: 1px solid var(--primary); }
  .s-bar { width: 320px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .s-bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.2s; }

  header {
    height: 60px; background: rgba(10,14,28,0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--primary); }
  .brand h1 { font-size: 16px; font-weight: 800; }
  .brand small { display: block; font-size: 11px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.12);
    padding: 7px 13px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .tab.active { background: var(--primary); color: #060912; border-color: transparent; }
  .os-pill { background: rgba(255,255,255,0.07); border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .card {
    background: linear-gradient(160deg, var(--surface), var(--surface2));
    border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 16px;
  }
  .card h3 { font-size: 14px; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .metric { font-size: 28px; font-weight: 800; color: var(--text); }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn {
    background: var(--primary); color: #060912; border: none; padding: 8px 14px;
    border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer;
  }
  .btn.alt { background: var(--accent); color: #060912; }
  .btn.ghost { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
  input, select, textarea {
    background: rgba(5,8,18,0.75); border: 1px solid rgba(255,255,255,0.18);
    color: var(--text); padding: 9px 12px; border-radius: 10px; font-size: 13px; width: 100%;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  th { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.1); color: var(--primary); }
  .badge.ok { background: rgba(16,185,129,0.2); color: #34D399; }
  .badge.warn { background: rgba(245,158,11,0.2); color: #FBBF24; }
  pre { background: rgba(0,0,0,0.45); padding: 12px; border-radius: 10px; font-size: 12px; overflow-x: auto; color: #D1E7FF; }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-card">
    <img src="/assets/icon_256.png" alt="Icon">
    <div>
      <div style="font-size:24px;font-weight:800;">Phoenix Creator Bench</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px;">Worldbuilding, Lore, Storyboard & Canon Integrity Architecture Suite</div>
      <div class="s-bar"><div id="sbar"></div></div>
    </div>
  </div>
</div>

<header>
  <div class="brand">
    <img src="/assets/icon_256.png" alt="Icon">
    <div><h1>Phoenix Creator Bench</h1><small>v1.1.0 • Local-First Universe Bible (Windows / macOS / Linux)</small></div>
  </div>
  <div class="tabs">
      <button class="tab active" onclick="openTab('bible',this)">Universe Bible &amp; Canon</button>
      <button class="tab" onclick="openTab('export',this)">Export Markdown</button>
      <button class="tab" onclick="openTab('os',this)">OS Exclusive</button></div>
  <div class="os-pill" id="os-pill">WINDOWS EDITION</div>
</header>

<main><div class="wrap">
      <section id="tab-bible" class="panel active">
        <div class="card" style="margin-bottom:14px;">
          <h3>Add Canon Entity (Character / Faction / Timeline / Lore / Scene)</h3>
          <div style="display:grid;grid-template-columns:150px 1fr 160px 130px;gap:10px;margin-bottom:10px;">
            <select id="s-kind"><option>Character</option><option>Faction</option><option>Timeline</option><option>Lore</option><option>Storyboard Scene</option></select>
            <input id="s-name" placeholder="Entity / Arc Name">
            <input id="s-era" placeholder="Era / Arc">
            <select id="s-canon"><option>Locked</option><option>Draft</option><option>Needs Review</option></select>
          </div>
          <textarea id="s-body" rows="3" placeholder="Canon description, continuity rules, relationships..."></textarea>
          <div style="margin-top:10px;"><button class="btn" onclick="addEntry()">Save to Universe Bible</button></div>
        </div>
        <div class="grid" id="s-list"></div>
      </section>
      <section id="tab-export" class="panel">
        <div class="card"><h3>Compiled Universe Bible Markdown</h3><pre id="s-md"></pre></div>
      </section>
      <section id="tab-os" class="panel"><div class="grid" id="os-grid"></div></section></div></main>

<script>
(function(){
  let p = 18; const b = document.getElementById('sbar');
  const iv = setInterval(()=>{ p = Math.min(100, p+24); b.style.width = p+'%'; if(p>=100){ clearInterval(iv); setTimeout(()=>document.getElementById('splash').classList.add('hide'), 280); }}, 120);
})();

function openTab(id, btn){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

async function loadOsParity(containerId){
  const p = await (await fetch('/api/platform')).json();
  document.getElementById('os-pill').textContent = (p.os_label || 'WINDOWS').toUpperCase() + ' EDITION';
  const el = document.getElementById(containerId);
  if(!el) return;
  const caps = p.exclusive_capabilities || {};
  el.innerHTML = ['windows','macos','linux'].map(k=>`
    <div class="card">
      <h3>${k.toUpperCase()} <span class="badge ${p.os===k?'ok':''}">${p.os===k?'ACTIVE HOST':'PARITY TARGET'}</span></h3>
      <div class="sub" style="line-height:1.65;">${(caps[k]||[]).map(c=>'&bull; '+c).join('<br>')}</div>
    </div>`).join('');
}

    async function loadBible(){
      const d = await (await fetch('/api/bible')).json();
      document.getElementById('s-list').innerHTML = (d.entries||[]).map(e=>`
        <div class="card">
          <h3>${e.name} <span class="badge ${e.canon==='Locked'?'ok':'warn'}">${e.kind} • ${e.canon}</span></h3>
          <div class="sub" style="margin-bottom:6px;">Era: ${e.era}</div>
          <p style="font-size:13px;line-height:1.5;">${e.body}</p>
        </div>`).join('');
      document.getElementById('s-md').textContent = '# ' + d.universe + '\n\n' + (d.entries||[]).map(e=>`## [${e.kind}] ${e.name} (${e.era} — ${e.canon})\n${e.body}\n`).join('\n');
    }
    async function addEntry(){
      const name = document.getElementById('s-name').value.trim(); if(!name) return;
      await fetch('/api/bible',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        kind:document.getElementById('s-kind').value, name, era:document.getElementById('s-era').value,
        canon:document.getElementById('s-canon').value, body:document.getElementById('s-body').value
      })});
      document.getElementById('s-name').value=''; document.getElementById('s-body').value=''; loadBible();
    }
    loadBible(); loadOsParity('os-grid');
</script>
</body>
</html>
